<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alquimia Docente</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9.6 20.5h12.8l2.2 3.6c1 1.8-.3 3.9-2.3 3.9H9.7c-2 0-3.3-2.1-2.3-3.9z' fill='%23d4532a'/%3E%3Cpath d='M12.5 3.5h7M14 3.5v8.6L7 23.6c-1.4 2.4.3 5.4 3.1 5.4h11.8c2.8 0 4.5-3 3.1-5.4L18 12.1V3.5' fill='none' stroke='%231c2130' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fuentes.css">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<!-- ============ Portada ============ -->
<section class="pantalla portada" id="portada">
  <div class="portada-deco" id="portadaDeco" aria-hidden="true"></div>
  <div class="portada-centro">
    <p class="portada-antes">Un juego de mezclas para quienes enseñan</p>
    <h1 class="titulo-tiza"><span>Alquimia</span> <span>Docente</span></h1>
    <p class="portada-sub" id="portadaSub">Suelta una ficha sobre otra y recorre la docencia universitaria desde su raíz.</p>
    <div class="demo" id="portadaDemo" aria-hidden="true"></div>
    <div class="portada-botones" id="portadaBotones"></div>
    <p class="portada-pie" id="portadaPie"></p>
  </div>
</section>

<!-- ============ Juego ============ -->
<section class="pantalla juego" id="juego" hidden>
  <header class="cabecera">
    <button class="logo" id="btnInicio" type="button" title="Volver a la portada"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9.6 20.5h12.8l2.2 3.6c1 1.8-.3 3.9-2.3 3.9H9.7c-2 0-3.3-2.1-2.3-3.9z" fill="#d4532a"/><circle cx="14" cy="23.6" r="1.3" fill="#ffe2a8"/><circle cx="18.6" cy="25" r="0.9" fill="#ffe2a8"/><path d="M12.5 3.5h7M14 3.5v8.6L7 23.6c-1.4 2.4.3 5.4 3.1 5.4h11.8c2.8 0 4.5-3 3.1-5.4L18 12.1V3.5" fill="none" stroke="#1c2130" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M25.5 4.5l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z" fill="#e0a01a"/></svg><span>Alquimia Docente</span></button>
    <div class="mision-cab" id="misionCab"></div>
    <div class="cab-der">
      <span class="chispas" id="chispas" title="Chispas: ganas una por cada ficha nueva y sirven para pedir pistas">✨ <b>0</b></span>
      <span class="contador" id="contador" title="Fichas descubiertas"></span>
      <button class="icono" id="btnSonido" type="button" title="Sonido">🔊</button>
    </div>
  </header>

  <div class="tablero">
    <aside class="hoja-mision" id="hojaMision" aria-label="Tu misión"></aside>

    <main class="pizarra" id="pizarra" aria-label="Pizarra: suelta una ficha sobre otra para mezclarlas">
      <canvas class="polvo" id="polvo" aria-hidden="true"></canvas>
      <div class="pizarra-nota" id="pizarraNota"></div>
    </main>

    <aside class="caja" id="caja" aria-label="Tu caja de fichas">
      <div class="caja-cab">
        <h2>Tu caja <small id="cajaCuenta"></small></h2>
        <div class="caja-herr">
          <input id="buscar" type="search" placeholder="Buscar ficha" autocomplete="off" aria-label="Buscar ficha">
          <button class="icono pequeno" id="btnOrden" type="button" title="Ordenar">⇅</button>
        </div>
      </div>
      <div class="caja-lista" id="cajaLista"></div>
    </aside>
  </div>

  <footer class="bandeja" aria-label="Herramientas">
    <button class="tiza-btn" id="btnPista" type="button"><span>💡</span>Pista</button>
    <button class="tiza-btn" id="btnBorrar" type="button"><span>🧽</span>Borrar pizarra</button>
    <button class="tiza-btn" id="btnPlano" type="button"><span>🗺️</span>Plano</button>
    <button class="tiza-btn" id="btnMisiones" type="button"><span>📜</span>Misiones</button>
    <button class="tiza-btn" id="btnCuaderno" type="button"><span>📒</span>Cuaderno</button>
    <button class="tiza-btn" id="btnPlan" type="button"><span>📝</span>Mi plan</button>
  </footer>
</section>

<!-- ============ Capas ============ -->
<div class="capa" id="capaFicha" hidden><article class="ficha-estudio" id="fichaEstudio" role="dialog" aria-modal="true" aria-labelledby="fichaTitulo"></article></div>
<div class="capa" id="capaPanel" hidden><div class="panel-tiza" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="capa capa-plano" id="capaPlano" hidden>
  <div class="plano-marco">
    <div class="plano-cab"><h2 id="planoTitulo">Plano</h2><p id="planoInfo"></p><button class="icono" id="planoCerrar" type="button" aria-label="Cerrar plano">✕</button></div>
    <div class="plano-lienzo" id="planoLienzo"><svg id="planoSvg"></svg></div>
    <div class="plano-pista" id="planoPista" hidden></div>
  </div>
</div>
<div class="celebracion" id="celebracion" hidden></div>
<div class="avisos" id="avisos" aria-live="polite"></div>
<div class="coach" id="coach" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
